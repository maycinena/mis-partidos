name: Actualizar calendario

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
  push:
    paths:
      - "equipos.json"
      - "partidos.py"

permissions:
  contents: write

concurrency:
  group: actualizar-calendario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar partidos.ics
        run: python3 partidos.py

      - name: Publicar si hubo cambios
        run: |
          if git diff --quiet -- partidos.ics; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "calendario-bot"
          git config user.email "calendario-bot@users.noreply.github.com"
          git add partidos.ics
          git commit -m "Actualizar calendario $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
